<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ICC Desk</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 320px; }
  .badge {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    border-radius: 14px;
    background: #1d4ed8;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
  }
  h1 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 20px; }
  button {
    appearance: none; border: 0; cursor: pointer;
    background: #1d4ed8; color: #fff;
    font-size: 14px; font-weight: 600;
    padding: 10px 24px; border-radius: 8px;
  }
  button:active { background: #1e40af; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">ICC</div>
    <h1>Can&rsquo;t reach ICC Desk</h1>
    <p>Check your internet connection and try again. If you&rsquo;re online, the server may be briefly unavailable.</p>
    <button onclick="window.location.replace('https://iccdesk.duckdns.org')">Retry</button>
  </div>
</body>
</html>
